[package]
name = "ci"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A tiny Git-native CI runner that installs itself into Git hooks."
repository = "https://example.invalid/ci"

[profile.release]
lto = true
strip = true
codegen-units = 1

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2"
