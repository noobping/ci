name: install-local
on:
  - manual
needs: build

steps:
  - name: install executable
    container: false
    use: export
    src: 'dist/ci-linux-${{ env.CI_ARCH }}'
    dest: '~/.local/bin/ci.${{ env.CI_ARCH }}'
    replace: true

  - name: link host executable
    if: arch(host)
    container: false
    use: link
    src: '~/.local/bin/ci.${{ env.CI_ARCH }}'
    dest: ~/.local/bin/ci
    replace: true

  - name: install bash completion
    if: arch(host)
    container: false
    run: |
      mkdir -p ~/.local/share/bash-completion/completions
      ~/.local/bin/ci completion bash > ~/.local/share/bash-completion/completions/ci

  - name: install manual
    if: arch(host)
    container: false
    run: |
      mkdir -p ~/.local/share/man/man1
      ~/.local/bin/ci man --dir ~/.local/share/man/man1
