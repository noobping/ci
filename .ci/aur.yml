name: aur
on:
  - manual
needs: build

steps:
  - name: generate .SRCINFO
    if: "arch(host) && exists(cmd:makepkg)"
    container: false
    run: |
      cd packaging/aur/ci-git
      makepkg --printsrcinfo > .SRCINFO

  - name: commit AUR metadata
    if: "arch(host) && exists(file:packaging/aur/ci-git/.SRCINFO)"
    use: commit
    paths:
      - packaging/aur/ci-git/PKGBUILD
      - packaging/aur/ci-git/.SRCINFO
    message: "aur: update ci-git package metadata"
