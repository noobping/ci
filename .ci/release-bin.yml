name: release-bin
on:
  - manual
  - post-receive
needs: build

env:
  CI_RELEASE_DIR: /var/www/git

steps:
  - name: publish binary
    container: false
    run: |
      release_dir="${CI_RELEASE_DIR:-dist/release}"
      mkdir -p "$release_dir"
      install -Dm0755 "dist/ci-linux-$CI_ARCH" "$release_dir/ci-linux-$CI_ARCH"
