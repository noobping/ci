name: install-bare
on:
  - manual
needs: build

steps:
  - name: install runner into bare repository
    if: "arch(host) && exists(env:CI_BARE_REPO)"
    container: false
    run: |
      hooks="${CI_BARE_HOOKS:-server}"
      "dist/ci-linux-$CI_ARCH" --repo "$CI_BARE_REPO" --arch x64,arm64 install --mode copy --source 'dist/ci-linux-{arch}' --hooks "$hooks" --force
