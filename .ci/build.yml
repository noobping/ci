name: build
on:
  - manual
  - pre-push
branches:
  only:
    - main
    - master
    - develop
    - development
artifacts:
  paths:
    - target/release/ci
  mode: keep
steps:
  - name: Format
    run: cargo fmt --check
  - name: Lint
    run: cargo clippy --all-targets -- -D warnings
  - name: Test
    run: cargo test --all
  - name: Build
    run: cargo build --release
  - name: Generate CLI Docs
    run: |
      tmp="$(mktemp -d)"
      cargo run -- completion bash > "$tmp/ci.bash"
      cargo run -- man --dir "$tmp/man"
      test -s "$tmp/ci.bash"
      test -s "$tmp/man/ci.1"
