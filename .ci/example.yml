name: build example
on:
  - manual
  - pre-push
branches:
  only:
    - main
    - master
    - develop
    - development
artifacts:
  paths:
    - target/release/ci
  mode: keep
steps:
  - name: Checkout
    uses: checkout
    with:
      submodules: recursive
  - name: Require flatpak-spawn for toolbox cargo fallback
    if: "missing(cargo) && missing(flatpak-spawn)"
    run: |
      echo "cargo is not available on PATH and flatpak-spawn is missing" >&2
      exit 127
  - name: Require toolbox for cargo fallback
    if: "success && missing(cargo) && missing(toolbox)"
    run: |
      echo "cargo is not available on PATH and toolbox is missing" >&2
      exit 127
  - name: Format
    if: "success && exists(cargo)"
    run: cargo fmt --check
  - name: Format (toolbox)
    if: "success && missing(cargo) && exists(flatpak-spawn) && exists(toolbox)"
    run: flatpak-spawn --host toolbox run cargo fmt --check
  - name: Lint
    if: "success && exists(cargo)"
    run: cargo clippy --all-targets -- -D warnings
  - name: Lint (toolbox)
    if: "success && missing(cargo) && exists(flatpak-spawn) && exists(toolbox)"
    run: flatpak-spawn --host toolbox run cargo clippy --all-targets -- -D warnings
  - name: Test
    if: "success && exists(cargo)"
    run: cargo test --all
  - name: Test (toolbox)
    if: "success && missing(cargo) && exists(flatpak-spawn) && exists(toolbox)"
    run: flatpak-spawn --host toolbox run cargo test --all
  - name: Build
    if: "success && exists(cargo)"
    run: cargo build --release
  - name: Build (toolbox)
    if: "success && missing(cargo) && exists(flatpak-spawn) && exists(toolbox)"
    run: flatpak-spawn --host toolbox run cargo build --release
  - name: Generate CLI Docs
    if: "success && exists(cargo)"
    run: |
      tmp="$(mktemp -d)"
      cargo run -- completion bash > "$tmp/ci.bash"
      cargo run -- man --dir "$tmp/man"
      test -s "$tmp/ci.bash"
      test -s "$tmp/man/ci.1"
  - name: Generate CLI Docs (toolbox)
    if: "success && missing(cargo) && exists(flatpak-spawn) && exists(toolbox)"
    run: |
      tmp="$(mktemp -d)"
      flatpak-spawn --host toolbox run cargo run -- completion bash > "$tmp/ci.bash"
      flatpak-spawn --host toolbox run cargo run -- man --dir "$tmp/man"
      test -s "$tmp/ci.bash"
      test -s "$tmp/man/ci.1"
